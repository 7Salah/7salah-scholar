
name: Game Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        working-directory: game
        run: npm ci

      - name: Run tests
        working-directory: game
        run: npm test

      - name: Build game
        working-directory: game
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: game-build
          path: game/dist/
          
